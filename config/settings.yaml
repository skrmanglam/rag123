# RAG Builder configuration file

# Chunking settings
chunking:
  chunk_size: 800 # approximate tokens
  chunk_overlap: 150 # approximate tokens

# Embedding settings
embedding:
  model_name: "all-MiniLM-L6-v2"

# Retrieval settings
retrieval:
  top_k: 5

# Vector store settings
vector_store:
  collection_name: "rag_documents"
  host: "localhost"
  port: 6333

# LLM settings
llm:
  provider: "ollama" # Options: "ollama", "openai", "openai_compatible"

  # Ollama settings(FREE - runs locally)
  ollama:
    base_url: "http://localhost:11434"
    model: "phi3:mini" # Use exact model name from `ollama list`
    # Examples: "phi3:mini", "llama3.2", etc.
    # Check installed models: ollama list

  # OpenAI settings (PAID - requires API key)
  openai:
    api_key: "gpt-3.5-turbo"
    api_key: "" # set via OPEN_API_KEY env var

  # OpenAI-compatible endpoints (e.g., LM Studio, vLLM, etc.)
  openai_compatible:
    base_url: "http://localhost:1234/v1"
    model: "local-model" # Use exact model name from your compatible endpoint)
    api_key: "not-needed"

  # Common settings
  temperature: 0.1
  max_tokens: 500

# Storage settings
storage:
  upload_dir: "storage/uploaded_files"
  faq_dir: "storage/faq_files"

# Database settings
database:
  path: "db/rag_builder.db"

# FAQ Cache settings
faq: 
  similarity_threshold: 0.80 # Minimum similarity score for FAQ matc(0.0-1.0)
  # Higher threshold = stricter matching (more precise)
  # Lower threshold = looser matching ( more result)
  # Recommended: 0.75-0.85 for good semantic matching
  # Note: 0.80 allows for question variations while maintaining relevance
  
    